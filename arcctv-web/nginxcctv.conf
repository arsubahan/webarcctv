 server {
    listen 80;
    server_name arazcctv.com www.arazcctv.com;

    location / {
        client_max_body_size 0; # Disables the limit       
        root /usr/share/nginx/html/browser;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /images/clientimg/ {
        alias /arcctvapp/arcctv-web/public/clientimg; # Adjust to your container path
        autoindex on;
    }

    location /stream/ {
        client_max_body_size 0; # Disables the limit
        proxy_pass http://arcctv-stream:3265/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

  location /api/ {
        client_max_body_size 0; # Disables the limit
        proxy_pass http://arcctv-server:3250/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

 # Proxy WebSocket video connection to Node.js backend
    location /ws/ {
        proxy_pass http://arcctv-server:4110/; # Points to the backend service in docker-compose
        
        # Critical WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # Disable timeouts for continuous streaming
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

       

}


 
